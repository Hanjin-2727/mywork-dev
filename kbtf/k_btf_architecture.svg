<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 920" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Noto Sans KR', 'NanumSquare', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <!-- Card Shadow -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="box-shadow" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="20" y="20" width="1020" height="880" rx="16" fill="#ffffff" stroke="#dcdfe4" stroke-width="1.5" filter="url(#card-shadow)" />

  <!-- Header Section -->
  <g transform="translate(530, 45)" text-anchor="middle">
    <!-- Tag -->
    <rect x="-65" y="0" width="130" height="26" rx="13" fill="#e8f0fe" stroke="#c2e7ff" stroke-width="1" />
    <text x="0" y="17" fill="#1a73e8" font-size="12" font-weight="700" letter-spacing="0.5">Visual Box 08</text>
    <!-- Title -->
    <text x="0" y="52" fill="#202124" font-size="22" font-weight="800" letter-spacing="-0.5">K-BTF 2-Tier 하이브리드 목표 서비스 아키텍처</text>
  </g>

  <!-- ==================== Layer 1: 이용자 계층 ==================== -->
  <g transform="translate(60, 130)">
    <!-- Layer 1 Background Card -->
    <rect x="0" y="0" width="940" height="150" rx="12" fill="#f8fbff" stroke="#aecbfa" stroke-width="1.5" />
    <!-- Header -->
    <rect x="20" y="16" width="48" height="24" rx="6" fill="#1a73e8" />
    <text x="44" y="32" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">1계층</text>
    <text x="78" y="33" fill="#174ea6" font-size="15" font-weight="700">[이용자 계층 / End-Point]</text>

    <!-- Sub items (2 Grid) -->
    <!-- Item 1.1 -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="440" height="80" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1" filter="url(#box-shadow)" />
      <path d="M0 8 Q0 0 8 0 L8 0 L8 80 L8 80 Q0 80 0 72 Z" fill="#1a73e8" />
      <text x="24" y="34" fill="#202124" font-size="14.5" font-weight="700">스마트폰 PWA '우리단지 ON'</text>
      <text x="24" y="58" fill="#5f6368" font-size="12.5" font-weight="500">DID 발급 · 전자지갑 · 주민소통 채널</text>
    </g>
    <!-- Item 1.2 -->
    <g transform="translate(480, 52)">
      <rect x="0" y="0" width="440" height="80" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1" filter="url(#box-shadow)" />
      <path d="M0 8 Q0 0 8 0 L8 0 L8 80 L8 80 Q0 80 0 72 Z" fill="#1a73e8" />
      <text x="24" y="34" fill="#202124" font-size="14.5" font-weight="700">2G폰 개인정보 배제 실물 NFC 목걸이</text>
      <text x="24" y="58" fill="#5f6368" font-size="12.5" font-weight="500">디지털 취약계층 전용 보급 (420개)</text>
    </g>
  </g>

  <!-- Connector 1 -->
  <g transform="translate(530, 280)">
    <line x1="0" y1="0" x2="0" y2="45" stroke="#80868b" stroke-width="2" />
    <!-- Connector Badge -->
    <g transform="translate(0, 22)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#202124" filter="url(#badge-shadow)" />
      <text x="0" y="4" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">▼ NFC 1초 태깅 / HTTPS API</text>
    </g>
    <polygon points="-5,45 5,45 0,52" fill="#80868b" />
  </g>

  <!-- ==================== Layer 2: 서비스 처리 및 데이터 분산 계층 ==================== -->
  <g transform="translate(60, 335)">
    <!-- Layer 2 Background Card -->
    <rect x="0" y="0" width="940" height="230" rx="12" fill="#f6fbf7" stroke="#ceead6" stroke-width="1.5" />
    <!-- Header -->
    <rect x="20" y="16" width="48" height="24" rx="6" fill="#188038" />
    <text x="44" y="32" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">2계층</text>
    <text x="78" y="33" fill="#0d652d" font-size="15" font-weight="700">[서비스 처리 및 데이터 분산 계층 / Off-Chain Cloud]</text>

    <!-- Sub items (2x2 Grid) -->
    <!-- Item 2.1 -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="440" height="74" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1" filter="url(#box-shadow)" />
      <path d="M0 8 Q0 0 8 0 L8 0 L8 74 L8 74 Q0 74 0 66 Z" fill="#188038" />
      <text x="24" y="32" fill="#202124" font-size="14.5" font-weight="700">CSAP 표준등급 IaaS/PaaS</text>
      <text x="24" y="54" fill="#5f6368" font-size="12.5" font-weight="500">공공 클라우드 보안인증 인프라 (월 125만 원)</text>
    </g>
    <!-- Item 2.2 -->
    <g transform="translate(480, 52)">
      <rect x="0" y="0" width="440" height="74" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1" filter="url(#box-shadow)" />
      <path d="M0 8 Q0 0 8 0 L8 0 L8 74 L8 74 Q0 74 0 66 Z" fill="#188038" />
      <text x="24" y="32" fill="#202124" font-size="14.5" font-weight="700">PostgreSQL</text>
      <text x="24" y="54" fill="#5f6368" font-size="12.5" font-weight="500">AES-256 암호화 비식별 데이터베이스</text>
    </g>
    <!-- Item 2.3 -->
    <g transform="translate(20, 138)">
      <rect x="0" y="0" width="440" height="74" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1" filter="url(#box-shadow)" />
      <path d="M0 8 Q0 0 8 0 L8 0 L8 74 L8 74 Q0 74 0 66 Z" fill="#188038" />
      <text x="24" y="32" fill="#202124" font-size="14.5" font-weight="700">Redis In-Memory 캐시</text>
      <text x="24" y="54" fill="#5f6368" font-size="12.5" font-weight="500">초고속 실시간 매칭 엔진 (0.1초 매칭)</text>
    </g>
    <!-- Item 2.4 -->
    <g transform="translate(480, 138)">
      <rect x="0" y="0" width="440" height="74" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1" filter="url(#box-shadow)" />
      <path d="M0 8 Q0 0 8 0 L8 0 L8 74 L8 74 Q0 74 0 66 Z" fill="#188038" />
      <text x="24" y="32" fill="#202124" font-size="14.5" font-weight="700">IPFS 분산 스토리지</text>
      <text x="24" y="54" fill="#5f6368" font-size="12.5" font-weight="500">위변조 방지 일일 원본 데이터 백업</text>
    </g>
  </g>

  <!-- Connector 2 -->
  <g transform="translate(530, 565)">
    <line x1="0" y1="0" x2="0" y2="45" stroke="#80868b" stroke-width="2" />
    <!-- Connector Badge -->
    <g transform="translate(0, 22)">
      <rect x="-160" y="-14" width="320" height="28" rx="14" fill="#202124" filter="url(#badge-shadow)" />
      <text x="0" y="4" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">▼ 매일 18시 SHA-256 Hash 배치 전송</text>
    </g>
    <polygon points="-5,45 5,45 0,52" fill="#80868b" />
  </g>

  <!-- ==================== Layer 3: 신뢰 및 검증 계층 ==================== -->
  <g transform="translate(60, 620)">
    <!-- Layer 3 Background Card -->
    <rect x="0" y="0" width="940" height="150" rx="12" fill="#faf6fe" stroke="#e8d0fb" stroke-width="1.5" />
    <!-- Header -->
    <rect x="20" y="16" width="48" height="24" rx="6" fill="#9334e6" />
    <text x="44" y="32" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">3계층</text>
    <text x="78" y="33" fill="#681da8" font-size="15" font-weight="700">[신뢰 및 검증 계층 / On-Chain K-BTF Mainnet]</text>

    <!-- Sub items (3 Grid) -->
    <!-- Item 3.1 -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="286" height="80" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1" filter="url(#box-shadow)" />
      <path d="M0 8 Q0 0 8 0 L8 0 L8 80 L8 80 Q0 80 0 72 Z" fill="#9334e6" />
      <text x="18" y="34" fill="#202124" font-size="14" font-weight="700">K-BTF DID 서명 검증</text>
      <text x="18" y="58" fill="#5f6368" font-size="12" font-weight="500">신원/자격 증명 검증</text>
    </g>
    <!-- Item 3.2 -->
    <g transform="translate(326, 52)">
      <rect x="0" y="0" width="286" height="80" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1" filter="url(#box-shadow)" />
      <path d="M0 8 Q0 0 8 0 L8 0 L8 80 L8 80 Q0 80 0 72 Z" fill="#9334e6" />
      <text x="18" y="34" fill="#202124" font-size="14" font-weight="700">스마트 컨트랙트</text>
      <text x="18" y="58" fill="#5f6368" font-size="12" font-weight="500">시간크레딧 자동 정산 실행</text>
    </g>
    <!-- Item 3.3 -->
    <g transform="translate(632, 52)">
      <rect x="0" y="0" width="286" height="80" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1" filter="url(#box-shadow)" />
      <path d="M0 8 Q0 0 8 0 L8 0 L8 80 L8 80 Q0 80 0 72 Z" fill="#9334e6" />
      <text x="18" y="34" fill="#202124" font-size="14" font-weight="700">일일 배치 앵커링 공증</text>
      <text x="18" y="58" fill="#5f6368" font-size="12" font-weight="500">블록체인 불변성 증명</text>
    </g>
  </g>
</svg>

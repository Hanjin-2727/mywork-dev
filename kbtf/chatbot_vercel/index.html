<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>K-BTF 스마트 주거복지 AI 민원 상담 챗봇</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap');
    body { font-family: 'Pretendard', -apple-system, sans-serif; }
    .chat-bubble { animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col justify-between overflow-hidden">

  <!-- Header -->
  <header class="bg-slate-900/95 border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-lg shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-cyan-400 flex items-center justify-center text-white text-lg shadow-lg shadow-indigo-500/20">
        <i class="fa-solid fa-robot"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-black text-white text-base md:text-lg tracking-tight">K-BTF 민원 챗봇</h1>
          <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> 24시간 실시간
          </span>
        </div>
        <p class="text-[11px] text-slate-400">영구임대 스마트 하우징 24H 입주민 상담</p>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <button onclick="emergencyAlert()" class="bg-red-500/20 border border-red-500/40 text-red-400 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-bell animate-bounce"></i> 긴급 복지사 호출
      </button>
    </div>
  </header>

  <!-- Quick FAQ Chips (Horizontal Scroll) -->
  <div class="bg-slate-900/60 border-b border-slate-800/80 px-4 py-2.5 overflow-x-auto flex items-center gap-2 shrink-0 scrollbar-none">
    <span class="text-[11px] text-slate-400 font-bold shrink-0">빠른 질문:</span>
    <button onclick="quickAsk('관리비 고지서 언제 나오나요?')" class="bg-slate-800 hover:bg-indigo-600 hover:text-white border border-slate-700 text-slate-300 text-xs px-3 py-1 rounded-full transition-all shrink-0">
      📑 관리비 조회
    </button>
    <button onclick="quickAsk('방문 차량 주차 등록 어떻게 하나요?')" class="bg-slate-800 hover:bg-indigo-600 hover:text-white border border-slate-700 text-slate-300 text-xs px-3 py-1 rounded-full transition-all shrink-0">
      🚗 주차 등록
    </button>
    <button onclick="quickAsk('경로식당 1초 식사패스는 어떻게 쓰나요?')" class="bg-slate-800 hover:bg-indigo-600 hover:text-white border border-slate-700 text-slate-300 text-xs px-3 py-1 rounded-full transition-all shrink-0">
      🍱 경로식당 식사패스
    </button>
    <button onclick="quickAsk('시간크레딧(KPT) 포인트는 어디서 쓰나요?')" class="bg-slate-800 hover:bg-indigo-600 hover:text-white border border-slate-700 text-slate-300 text-xs px-3 py-1 rounded-full transition-all shrink-0">
      🪙 시간크레딧 사용처
    </button>
    <button onclick="quickAsk('재활용 분리수거 배출 요일이 언제인가요?')" class="bg-slate-800 hover:bg-indigo-600 hover:text-white border border-slate-700 text-slate-300 text-xs px-3 py-1 rounded-full transition-all shrink-0">
      ♻️ 분리수거 요일
    </button>
  </div>

  <!-- Chat Messages Container -->
  <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4">
    <!-- Welcome Bot Message -->
    <div class="flex items-start gap-3 chat-bubble">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white text-xs shrink-0 shadow">
        <i class="fa-solid fa-robot"></i>
      </div>
      <div class="bg-slate-800 border border-slate-700/80 rounded-2xl rounded-tl-none p-4 max-w-[85%] md:max-w-lg text-sm text-slate-200 shadow-md space-y-2">
        <p class="font-bold text-white text-sm">안녕하세요, 입주민님! 👋</p>
        <p class="leading-relaxed text-xs md:text-sm">
          <b>K-BTF 스마트 주거복지 24시간 AI 민원 상담사</b>입니다. 
          관리비, 주차, 경로식당 식사패스, 시간크레딧 포인트 및 단지 생활 불편사항에 대해 무엇이든 편하게 물어보세요!
        </p>
        <div class="pt-2 border-t border-slate-700/60 text-[11px] text-slate-400 flex items-center gap-2">
          <i class="fa-solid fa-shield-check text-indigo-400"></i> W3C DID 기반 비식별 안전 상담
        </div>
      </div>
    </div>
  </main>

  <!-- Input Footer -->
  <footer class="bg-slate-900 border-t border-slate-800 p-3 md:p-4 shrink-0">
    <div class="max-w-4xl mx-auto flex items-center gap-2">
      <input type="text" id="user-input" placeholder="궁금한 사항이나 민원을 입력하세요..." 
             class="flex-1 bg-slate-800 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-all placeholder-slate-500"
             onkeypress="if(event.key === 'Enter') handleSend()">
      <button onclick="handleSend()" class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white w-11 h-11 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-600/30 transition-all shrink-0">
        <i class="fa-solid fa-paper-plane text-sm"></i>
      </button>
    </div>
    <div class="text-center text-[10px] text-slate-500 mt-2">
      K-BTF 스마트 주거복지 플랫폼 · 4단계 애자일 릴리즈 R1 Live Service
    </div>
  </footer>

  <script>
    const knowledgeBase = {
      "관리비": "📊 **관리비 안내**\n- 고지서 발행: 매월 25일 앱 및 우편 발행\n- 납부 마감: 매월 말일\n- 혜택: 보유하신 시간크레딧(KPT)으로 최대 20% 차감 감면이 가능합니다.",
      "주차": "🚗 **방문차량 주차 등록**\n- 앱 상단 [주차 등록] 메뉴에서 차량번호 입력 시 1초 자동 승인됩니다.\n- 1회 등록 시 최대 48시간 무료 주차가 적용됩니다.",
      "식사패스": "🍱 **경로식당 1초 식사패스**\n- 산남종합사회복지관 1층 경로식당 배식구 리더기에 발급받으신 실물 NFC 목걸이 주민증을 1초간 태깅하시면 자동 승인됩니다.\n- 운영시간: 평일 11:30 ~ 13:00",
      "식당": "🍱 **경로식당 1초 식사패스**\n- 산남종합사회복지관 1층 경로식당 배식구 리더기에 발급받으신 실물 NFC 목걸이 주민증을 1초간 태깅하시면 자동 승인됩니다.\n- 운영시간: 평일 11:30 ~ 13:00",
      "시간크레딧": "🪙 **시간크레딧(KPT) 리워드**\n- 단지 내 돌봄/환경정화 자원봉사 1시간 = 1 TimeCredit 적립\n- 사용처: 입주민 전용 폐쇄몰 물품 구매 할인 및 관리비 차감에 사용 가능합니다.",
      "포인트": "🪙 **시간크레딧(KPT) 리워드**\n- 단지 내 돌봄/환경정화 자원봉사 1시간 = 1 TimeCredit 적립\n- 사용처: 입주민 전용 폐쇄몰 물품 구매 할인 및 관리비 차감에 사용 가능합니다.",
      "분리수거": "♻️ **재활용 분리수거 배출 안내**\n- 배출 요일: 매주 화요일, 금요일\n- 배출 시간: 오후 18:00 ~ 오후 22:00\n- 배출 장소: 각 동별 분리수거 지정 부스",
      "쓰레기": "♻️ **재활용 분리수거 배출 안내**\n- 배출 요일: 매주 화요일, 금요일\n- 배출 시간: 오후 18:00 ~ 오후 22:00\n- 배출 장소: 각 동별 분리수거 지정 부스"
    };

    function appendMessage(sender, text, isHtml = false) {
      const chatBox = document.getElementById('chat-box');
      const isUser = sender === 'user';
      
      const msgDiv = document.createElement('div');
      msgDiv.className = `flex items-start gap-3 chat-bubble ${isUser ? 'justify-end' : 'justify-start'}`;
      
      if (isUser) {
        msgDiv.innerHTML = `
          <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-none px-4 py-3 max-w-[85%] md:max-w-md text-sm leading-relaxed shadow">
            ${text}
          </div>
          <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-white text-xs shrink-0">
            <i class="fa-solid fa-user"></i>
          </div>
        `;
      } else {
        const formattedText = isHtml ? text : text.replace(/\n/g, '<br>');
        msgDiv.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white text-xs shrink-0 shadow">
            <i class="fa-solid fa-robot"></i>
          </div>
          <div class="bg-slate-800 border border-slate-700/80 rounded-2xl rounded-tl-none p-4 max-w-[85%] md:max-w-lg text-sm text-slate-200 shadow space-y-2">
            <div class="leading-relaxed text-xs md:text-sm">${formattedText}</div>
            <div class="pt-1.5 border-t border-slate-700/60 text-[10px] text-slate-400 flex items-center justify-between">
              <span>출처: K-BTF 지식베이스</span>
              <span class="text-emerald-400 font-semibold">정확도 98%</span>
            </div>
          </div>
        `;
      }

      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleSend() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      appendMessage('user', text);
      input.value = '';

      // AI Typing Mock
      setTimeout(() => {
        let reply = "문의해 주신 내용에 대해 확인 중입니다. 상세 민원의 경우 관리사무소 담당자에게 전달되어 신속히 답변을 안내해 드리겠습니다.";
        for (let key in knowledgeBase) {
          if (text.includes(key)) {
            reply = knowledgeBase[key];
            break;
          }
        }
        appendMessage('bot', reply);
      }, 400);
    }

    function quickAsk(questionText) {
      document.getElementById('user-input').value = questionText;
      handleSend();
    }

    function emergencyAlert() {
      if (confirm("[긴급 복지사 호출]\n\n담당 사회복지사 및 관리사무소에 긴급 상담 알림(DID 암호화 신호)을 전송하시겠습니까?")) {
        alert("긴급 호출 신호가 산남복지관 맞춤돌봄팀에 즉시 전달되었습니다. 복지사가 유선 또는 현장 방문을 통해 연락드립니다.");
      }
    }
  </script>
</body>
</html>
